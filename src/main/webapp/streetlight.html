<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCity360 - Streetlight Management</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/city-buildings.png">

    <div id="header-container"></div>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div class="container-fluid px-4 mb-5 flex-grow-1">
    <div class="row g-4">

        <div class="col-lg-4 col-md-5">
            <div class="card shadow border-0 rounded-3">
                <div class="card-header bg-primary text-white fw-bold py-3">
                    <i class="fa-solid fa-lightbulb me-2"></i>Add Smart Streetlight
                </div>
                <div class="card-body p-4">
                    <form id="streetlightForm">
                        <div class="alert alert-info py-2" role="alert" style="font-size: 0.9em;">
                            <i class="fa-solid fa-circle-info me-1">

                            </i> Identical models will share the same memory instance!
                        </div>

                        <h6 class="fw-bold text-secondary mt-3 mb-3 border-bottom pb-2">
                            Hardware Specifications (Shared)</h6>
                        <div class="mb-3">
                            <label for="modelName" class="form-label fw-bold">Model Name</label>
                            <input type="text" class="form-control" id="modelName"
                                   placeholder="e.g. SL-LED-Pro" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="wattage" class="form-label fw-bold">Wattage (W)</label>
                                <input type="number" class="form-control" id="wattage" value="150" required>
                            </div>
                            <div class="col-6">
                                <label for="colorTemp" class="form-label fw-bold">Color Temp</label>
                                <select class="form-select" id="colorTemp" required>
                                    <option value="Warm White">Warm White</option>
                                    <option value="Cool White" selected>Cool White</option>
                                    <option value="Daylight">Daylight</option>
                                </select>
                            </div>
                        </div>

                        <h6 class="fw-bold text-secondary mt-4 mb-3 border-bottom pb-2">Location Setup (Unique)</h6>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="latitude" class="form-label fw-bold">Latitude</label>
                                <input type="number" step="0.000001" class="form-control"
                                       id="latitude" placeholder="7.728921" required>
                            </div>
                            <div class="col-6">
                                <label for="longitude" class="form-label fw-bold">Longitude</label>
                                <input type="number" step="0.000001" class="form-control"
                                       id="longitude" placeholder="80.117215" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mt-3">
                            <i class="fa-solid fa-plus-circle me-2"></i>Deploy Streetlight
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Right Panel: Streetlights Log -->
        <div class="col-lg-8 col-md-7">
            <div class="card shadow border-0 rounded-3 h-100">
                <div class="card-header bg-dark text-white fw-bold py-3 d-flex justify-content-between align-items-center">
                    <span><i class="fa-solid fa-road-spikes me-2 text-warning"></i>Deployed Streetlights Overview</span>
                    <button class="btn btn-sm btn-outline-light" onclick="loadStreetlights()">
                        <i class="fa-solid fa-rotate me-1"></i> Refresh</button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
                        <table class="table table-hover table-striped align-middle mb-0" style="min-width: 800px;">
                            <thead class="table-dark text-nowrap position-sticky top-0">
                            <tr>
                                <th style="width: 5%;">ID</th>
                                <th style="width: 25%;">Model (Shared Type)</th>
                                <th style="width: 25%;">Specifications</th>
                                <th style="width: 30%;">Coordinates (Unique)</th>
                                <th style="width: 15%; text-align: center;">Power</th>
                            </tr>
                            </thead>
                            <tbody id="streetlightTableBody">
                            <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<div id="footer-container"></div>

<script>
    fetch('includes/header.html')
        .then(res => res.text())
        .then(data => {
            document.getElementById('header-container').innerHTML = data;
            setTimeout(() => {
                const navLink = document.getElementById('nav-streetlight');
                if (navLink) navLink.classList.add('active');
            }, 50);
        });

    fetch('includes/footer.html')
        .then(res => res.text())
        .then(data => document.getElementById('footer-container').innerHTML = data);
</script>
<script src="js/streetlight.js"></script>
</body>
</html>
